name: Синхронизация с Telegram и публикация

on:
  # Каждый час (в 17 минут) забираем новые посты
  schedule:
    - cron: '17 * * * *'
  # Публикация при каждом изменении кода
  push:
    branches: [main]
  # Кнопка «Run workflow» во вкладке Actions
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Забрать новые посты из Telegram
        run: npm run fetch

      - name: Сохранить новые посты в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content public/media
          if git diff --cached --quiet; then
            echo "Новых постов нет"
          else
            git commit -m "Посты из Telegram: $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Собрать сайт
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
